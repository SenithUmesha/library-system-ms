name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - user-service-db
          - book-service-db
          - user-web-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Compile and package ${{ matrix.module }}
        run: mvn -B -f ${{ matrix.module }}/pom.xml -DskipTests package
